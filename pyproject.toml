[project]
name = "hiob-data"
version = "0.4.0"
description = "HIOB 공유 테이블 governor — 10 핸드오프 테이블의 단일 write 권위(소유권+beat_index+PIPA+tenancy). 겹침이 스키마로 새는 것 봉쇄(폴리레포 Phase 0.4)."
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hiob_data*"]

[tool.coverage.run]
branch = true
source = ["hiob_data"]

[tool.coverage.report]
fail_under = 100
show_missing = true
